services:
  frontend:
    container_name: tg-vault-staging-frontend
    build:
      args:
        VITE_API_URL: ${STAGING_VITE_API_URL:-http://127.0.0.1:${STAGING_BACKEND_PORT:-51957}}
    ports: !override
      - "127.0.0.1:${STAGING_FRONTEND_PORT:-47842}:80"
  backend:
    container_name: tg-vault-staging-backend
    ports: !override
      - "127.0.0.1:${STAGING_BACKEND_PORT:-51957}:${PORT:-51947}"
    environment:
      - CORS_ORIGIN=${STAGING_CORS_ORIGIN:-http://127.0.0.1:${STAGING_FRONTEND_PORT:-47842}}
      - OAUTH_CALLBACK_BASE_URL=${STAGING_OAUTH_CALLBACK_BASE_URL:-http://127.0.0.1:${STAGING_BACKEND_PORT:-51957}}
      - OAUTH_FRONTEND_ORIGIN=${STAGING_OAUTH_FRONTEND_ORIGIN:-http://127.0.0.1:${STAGING_FRONTEND_PORT:-47842}}
      - TELEGRAM_BOT_TOKEN=${STAGING_TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_API_ID=${STAGING_TELEGRAM_API_ID:-}
      - TELEGRAM_API_HASH=${STAGING_TELEGRAM_API_HASH:-}
      - TELEGRAM_SESSION_FILE=/data/staging_bot_session.txt
      - TELEGRAM_USER_SESSION_FILE=/data/staging_user_session.txt
      - TELEGRAM_REQUIRED=${STAGING_TELEGRAM_REQUIRED:-false}
  postgres:
    container_name: tg-vault-staging-postgres
